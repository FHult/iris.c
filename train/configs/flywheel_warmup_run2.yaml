# Flywheel warm-up run 2 — Bootstrap / exploration-heavy (fixed pipeline)
#
# This supersedes the original run-2 plan, which assumed a *successful* run 1.
# run 1 never trained (cache-dir clobber + a NameError in the SigLIP-coverage
# check, both now fixed), so there is no checkpoint, no performance scores, and
# no attribution data yet. run 2 is therefore a fresh exploration bootstrap with
# the same profile as run 1 — plus the pipeline fixes:
#   - precompute reuse via the consolidated cold cache (PRECOMP-3 encoder key)
#   - correct provenance-derived shard source labels in both DBs
#   - retain_staging to avoid re-copying overlapping shards cold->hot each iter
#
# Pool: 1280 shards (journeydb 744, coyo 413, coyo+laion+wikiart 95,
# journeydb+wikiart 28). 96 shards are already precomputed on cold under the
# canonical version (v_059443 / v_2232c1 / v_336c6e) and will be reused on reselect.
#
# Launch:
#   pipeline_ctl start-flywheel train/configs/flywheel_warmup_run2.yaml
#
# Coverage check:
#   train/.venv/bin/python train/scripts/shard_selector.py status

flywheel:
  name: "warmup-run2"
  max_iterations: 15
  steps_per_iteration: 1000
  n_shards: 40
  poll_interval: 60
  min_free_gb: 40

  base_checkpoint: null      # run 1 produced no checkpoint — start fresh

  training_config: "train/configs/stage1_512px.yaml"

  # Cold shard pool (1280 tars + provenance.json). Selected shards are staged to
  # hot per iteration.
  shards_dir: "/Volumes/16TBCold/shards"

  hyperparams:
    cross_ref_prob: 0.35
    style_loss_weight: 0.07

  shard_selection:
    performance_weight: 0.30   # low — few shards have reliable scores yet
    min_diversity_pct:  0.30   # high — maximize visual diversity
    exploration_rate:   0.40
    recency_penalty:    0.20
    recency_window_iters: 2

    exploration_schedule:
      - {through_iteration: 8,  rate: 0.45}
      - {through_iteration: 15, rate: 0.35}

    # Source minimums: guarantee a synthetic and a natural bucket each iter.
    # Keys MUST match the corrected provenance-derived source labels
    # (journeydb / coyo / coyo+laion+wikiart / journeydb+wikiart). The old
    # "laion_coyo" key matched zero shards after the source fix.
    per_source_min:
      journeydb: 6
      coyo:      6

  min_attribution_obs: 3
  siglip_sample_n: 50
  shard_manifest: null

  plateau_patience:   0        # disabled — too early to declare plateau
  plateau_threshold:  0.02
  ablation_every_n:   0        # disabled — no attribution signal yet
