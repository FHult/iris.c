# Flywheel warm-up run 2 — Validation / balanced
#
# Goal: coverage >= 72% (~215 shards), attribution confidence on 15-20% of pool,
# first ablation burst at iter 8 to find better hyperparams.
#
# Pre-run checklist:
#   1. Coverage >= 55% confirmed (shard_selector.py status)
#   2. Set base_checkpoint to latest step_*.safetensors from run 1:
#      ls -t /Volumes/2TBSSD/checkpoints/stage1/step_*.safetensors | head -1
#   3. After iter 8 ablation fires, pull best hyperparams:
#      python3 -c "import sqlite3,json; db=sqlite3.connect('/Volumes/2TBSSD/flywheel_history.db');
#        db.row_factory=sqlite3.Row; r=db.execute('SELECT best_hyperparams FROM campaign_summary
#        WHERE flywheel_name=?',('warmup-run2',)).fetchone();
#        print(json.loads(r['best_hyperparams']) if r and r['best_hyperparams'] else 'none')"
#
# Exit criteria:
#   >= 72% shards with n_scored>=1  (both sources >= 60%)
#   >= 15% shards with n_scored>=2
#   attr_confidence>=1.0 on at least 10 shards
#   best cond_gap >= 0.35 in at least one iteration

flywheel:
  name: "warmup-run2"
  max_iterations: 15
  steps_per_iteration: 1000
  n_shards: 40
  poll_interval: 60
  min_free_gb: 40

  # Warm-start from run 1's latest checkpoint — fill in before launching
  base_checkpoint: null   # SET THIS: /Volumes/2TBSSD/checkpoints/stage1/step_XXXXXX.safetensors

  training_config: "train/configs/stage1_512px.yaml"

  hyperparams:
    cross_ref_prob: 0.35   # will be updated after iter 8 ablation fires
    style_loss_weight: 0.07

  shard_selection:
    performance_weight: 0.45   # increase — more shards have scores now
    min_diversity_pct:  0.25
    exploration_rate:   0.30   # moderate — still covering new shards
    recency_penalty:    0.25
    recency_window_iters: 3

    exploration_schedule:
      - {through_iteration: 5,  rate: 0.35}
      - {through_iteration: 10, rate: 0.28}
      - {after_iteration: 10,   rate: 0.22}

    per_source_min:
      laion_coyo: 5
      journeydb:  5

  temporal_decay: 0.3          # recent iters weighted 30% vs older — start applying now

  min_attribution_obs: 2       # lower — shards getting 2nd observations
  siglip_sample_n: 50
  shard_manifest: null

  plateau_patience:   7        # soft check — unlikely to fire in 15 iters
  plateau_threshold:  0.03
  plateau_ablation_runs: 0

  # First ablation burst at midpoint (iter 8); adds ~4h to wall-clock
  ablation_every_n: 8
  ablation_max_runs: 4
  ablation_config: "train/configs/ablation_sref_v1.yaml"
