# Flywheel warm-up run 3 — champion warm-start (over-training fix)
#
# Supersedes the original run-3 plan (performance-biased exploit + ablation), whose
# premise — a successful, warm run 2 — did not hold. warmup-run2 trained cleanly but
# OVER-TRAINED: it warm-started each iteration from the LATEST checkpoint via --resume,
# so steps accumulated (1000->2000->3000) and cond_gap fell as train_loss fell
# (+0.0273 -> -0.0054 -> -0.0275 across 3 done iters). See plans/warmup-campaign-runbook.md §3.
#
# Fix (this run): resume_from_champion=true — every iteration warm-starts from the
# campaign CHAMPION (best cond_gap) with a FRESH schedule (--warmstart-weights,
# start_step=0), NOT the latest checkpoint. Each iteration is an independent 1000-step
# re-roll on fresh data that cannot drag the working checkpoint below the champion.
# iter-1 warm-starts from warmup-run2's preserved champion (cond_gap +0.0273); the
# shard-attribution scores from run2 carry over (shard-keyed in shard_scores.db).
#
# Ablation + exploit stay OFF: attribution is still cold (0/1280 fully attributed) —
# recipe ablation against cold scores tunes a moving target, and exploit needs reliable
# scores. The performance-biased exploit + ablation run (the old run-3 plan) is deferred
# to a LATER campaign, once attribution warms. See runbook §3 "run-vs-ablate".
#
# Launch:
#   pipeline_ctl start-flywheel train/configs/flywheel_warmup_run3.yaml

flywheel:
  name: "warmup-run3"
  max_iterations: 15
  steps_per_iteration: 1000
  n_shards: 40
  poll_interval: 60
  min_free_gb: 40

  # Warm-start every iteration from the champion with a fresh schedule (no step
  # accumulation, no compounding). iter-1 (no per-campaign best yet) falls back to
  # base_checkpoint below — warmup-run2's preserved champion.
  resume_from_champion: true
  base_checkpoint: "/Volumes/2TBSSD/checkpoints/warmup-run2-champion_step1000_condgap0.0273.safetensors"

  training_config: "train/configs/stage1_512px.yaml"

  # Cold shard pool (1280 tars + provenance.json). Selected shards are staged to
  # hot per iteration.
  shards_dir: "/Volumes/16TBCold/shards"

  hyperparams:
    cross_ref_prob: 0.35
    style_loss_weight: 0.07

  shard_selection:
    performance_weight: 0.30   # low — few shards have reliable scores yet
    min_diversity_pct:  0.30   # high — maximize visual diversity
    exploration_rate:   0.40
    recency_penalty:    0.20
    recency_window_iters: 2

    exploration_schedule:
      - {through_iteration: 8,  rate: 0.45}
      - {through_iteration: 15, rate: 0.35}

    # Source minimums: guarantee a synthetic and a natural bucket each iter.
    # Keys MUST match the corrected provenance-derived source labels
    # (journeydb / coyo / coyo+laion+wikiart / journeydb+wikiart). The old
    # "laion_coyo" key matched zero shards.
    per_source_min:
      journeydb: 6
      coyo:      6

  min_attribution_obs: 3
  siglip_sample_n: 50
  shard_manifest: null

  plateau_patience:   0        # disabled — too early to declare plateau
  plateau_threshold:  0.02
  ablation_every_n:   0        # disabled — attribution still cold (see runbook §3)
