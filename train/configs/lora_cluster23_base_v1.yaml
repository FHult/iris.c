# Retrieval-hybrid — cluster-23 (cyberpunk) LoRA trained on the 4B BASE (steerable; 50-step CFG).
# Tests whether base UNLOCKS the visible style transfer that distilled under-expresses (distilled gate:
# styleCSD Δ +0.06 but visually only a nudge — the SREF-STYLE-CEILING structure-lock). Same tight cluster
# (intra_cos 0.673) + same caches (VAE/Qwen3 are model-agnostic encoder outputs, serve base + distilled).
# NOTE: base transformer is guidance_embeds=false (true CFG at inference), so train_lora's guidance=None
# is the correct training regime — no code change needed.
model:
  flux_model_dir: flux-klein-4b-base
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]
  batch_size: 1
  seed: 42
  record_allowlist: /Volumes/2TBSSD/sref_eval/hot_style_clusters/cluster23_subset.json
training:
  num_steps: 400
  learning_rate: 1.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mlx_memory_pct: 0.6
  ema_decay: 0.9999
  ema_update_every: 10
  checkpoint_every: 200
