# Retrieval-hybrid — cluster-8 LoRA on the 4B BASE: bold graphic poster/screenprint (intra_cos 0.559). Part of the 3-style retrieval demo
# (c23 cyberpunk + c9 portrait + c8 graphic). Same recipe as lora_cluster23_base_v1.yaml, different cluster.
model:
  flux_model_dir: flux-klein-4b-base
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]
  batch_size: 1
  seed: 42
  record_allowlist: /Volumes/2TBSSD/sref_eval/hot_style_clusters/cluster08_subset.json
training:
  num_steps: 400
  learning_rate: 1.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mlx_memory_pct: 0.6
  ema_decay: 0.9999
  ema_update_every: 10
  checkpoint_every: 200
