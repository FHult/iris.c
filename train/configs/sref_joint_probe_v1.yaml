# SREF Stage-0.5 go/no-go — joint LoRA + CSDModulation with the CONTENT-SHARED PAIR contrastive.
# Batch-1 CONTENT + two decoupled forwards (correct ref / foreign ref), grads summed.
# plans/sref-joint-backbone-project.md §4. Zero new precompute: hot universe_csd + pool + vae/qwen3.
model:
  flux_model_dir: flux-klein-4b-base
adapter:
  lora_rank: 64                                 # trainable backbone (double+single attn); not the frozen/r16 that failed
  projector_ckpt: /Volumes/2TBSSD/checkpoints/latent_csd/latent_csd_projector.safetensors
data:
  bucket: [256, 256]                            # ¼ the tokens of 512px; batch-1 x 2 passes fits 16 GB. Requires the 256px VAE cache below.
  text_seq: 128                                 # FIXED text length → constant graph shape (avoids the recompile wedge)
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir:   /Volumes/2TBSSD/precomputed/vae_sref256px   # 256px latents (32,32,32); isolated sibling of precomputed/vae/. NOT v_2232c1 (512px). See dir README.
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  csd_cache_dir:   /Volumes/2TBSSD/universe_csd
  style_neighbors_db: /Volumes/2TBSSD/sref_eval/style_cache/neighbors.sqlite
  seed: 0
training:
  learning_rate: 1.0e-4
  warmup_steps: 50
  num_steps: 8000
  contrastive_weight: 1.0                        # λ on the pair term; ref-blind floor is λ·ln2 = 0.693
  infonce_tau: 0.1
  t_range: [700, 950]                            # below t≈400 the input pins x0_pred; authority peaks t≈700
  foreign_queue: 4096                            # rolling CSD bank -> branch B's foreign reference at batch 1
  foreign_max_cos: 0.5                           # above this the "foreign" ref may BE the target's style (label noise)
  null_style_prob: 0.1                           # CFG dropout: recon-only steps, no reference
  grad_checkpoint: true                          # 25.19 -> 15.72 GB per backward for 21% slower steps
  grad_clip: 1.0
  weight_decay: 0.01
  checkpoint_every: 1000
  checkpoint_dir: /Volumes/2TBSSD/checkpoints/sref_joint_probe
  guidance: 3.5
