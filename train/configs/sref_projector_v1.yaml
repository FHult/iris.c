# SREF Phase-1 Stage-1 — learned in-sequence style projector (plans/sref-phase1-projector.md).
# Wired to the EXISTING staged data (cribbed from sref_eval/style_arm/config.yaml): the precompute
# (SigLIP/VAE/Qwen3, ~522k samples) + hot shard pool + style look-pairing are already on hot SSD.
# Train ONLY the StyleProjector; DiT frozen. Caches are model-agnostic encoder outputs, so they
# serve the 4B BASE (plan's steerable target) as well as distilled.
model:
  flux_model_dir: flux-klein-4b-base          # base = steerable (distilled commits structure step 1)
adapter:
  num_style_tokens: 192
data:
  batch_size: 1
  bucket: [512, 512]
  shard_path: /Volumes/2TBSSD/baseline_pool_hot                     # hot pool (22 tars, incl. style subset)
  siglip_cache_dir: /Volumes/2TBSSD/precomputed/siglip/v_336c6e     # populated version (NOT empty current)
  vae_cache_dir:    /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir:  /Volumes/2TBSSD/precomputed/qwen3/v_059443
  style_neighbors_db: /Volumes/2TBSSD/sref_eval/style_cache/neighbors.sqlite  # look-paired (DATA-SELECTION PRINCIPLE)
  seed: 0
training:
  learning_rate: 1.0e-4
  warmup_steps: 50
  num_steps: 4000
  null_style_prob: 0.1
  grad_clip: 1.0
  weight_decay: 0.01
  checkpoint_every: 500
  checkpoint_dir: /Volumes/2TBSSD/checkpoints/sref_projector
  guidance: 3.5                                # 4B base CFG guidance
