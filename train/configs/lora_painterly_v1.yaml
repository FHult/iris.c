# SREF retrieval-hybrid Phase 0 (plans/sref-retrieval-hybrid-project.md) — the go/no-go per-style LoRA.
# Trains a painterly (impressionism-seeded) style LoRA on the hot pool, on the DISTILLED model so the
# scorecard gate is apples-to-apples with band-control's painterly styleCSD Δ 0.009 (also distilled).
# Cluster from train/lora/curate_style_seeded.py (seed = impressionism_landscape.jpg, N=250, cos~0.45).
model:
  flux_model_dir: flux-klein-model
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]
  batch_size: 1
  seed: 42
  record_allowlist: /Volumes/2TBSSD/sref_eval/lora_painterly_subset.json
training:
  num_steps: 400
  learning_rate: 1.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mlx_memory_pct: 0.6
  ema_decay: 0.9999
  ema_update_every: 10
  checkpoint_every: 200
