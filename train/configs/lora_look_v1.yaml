# Content-agnostic LOOK LoRA — trains on a cluster curated for a shared low-level LOOK (palette, tone,
# contrast, grain) but DIVERSE content (curate_lookstyle_subset.py: cluster in look-space, penalise CSD
# coherence so subjects vary). Selected cluster: high-key / bright / light-palette look, look_coh 0.961,
# csd_coh -0.010 (content-diverse, all 22 shards) — vs the CSD-far cluster's content-locked csd_coh ~0.75
# that entangled style with subject (LORA-TRAIN-3). Goal: a style that TRANSFERS to any subject.
model:
  flux_model_dir: flux-klein-model
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]
  batch_size: 1
  seed: 42
  record_allowlist: /Volumes/2TBSSD/sref_eval/lora_look_subset.json
training:
  num_steps: 300
  learning_rate: 1.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mlx_memory_pct: 0.6
  ema_decay: 0.9999
  ema_update_every: 10
  checkpoint_every: 150
