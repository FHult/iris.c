# train/configs/stage1_512px_online.yaml
# Stage 1 training — 512px, online encoding (no precomputed caches).
#
# All three encoder caches are null so qwen3, VAE, and SigLIP are computed
# at runtime.  ~380ms extra per step vs. the cached path; used for flywheel
# warmup runs before precompute_all.py has been run on the shard pool.
#
# Inherits all other settings from stage1_512px.yaml except the cache dirs.

model:
  flux_model_dir: "flux-klein-model"
  qwen3_model_dir: "flux-klein-model"
  siglip_model: "google/siglip-so400m-patch14-384"
  warmstart_path: null

adapter:
  num_blocks: 25
  num_double_blocks: 5
  hidden_dim: 3072
  num_image_tokens: 128
  siglip_dim: 1152
  perceiver_depth: 4
  perceiver_heads: 16
  style_only: false
  sref_strength: 1.0
  freeze_double_stream_scales: true
  block_gradient_checkpointing: false

data:
  shard_path: "train/data/shards"
  qwen3_cache_dir: null    # online encoding (~200ms/step overhead)
  vae_cache_dir: null      # online encoding (~180ms/step overhead)
  siglip_cache_dir: null   # online encoding (~siglip model loaded per batch)
  anchor_shard_dir: null
  anchor_mix_ratio: 0.20
  hard_example_dir: null
  hard_mix_ratio: 0.05
  batch_size: 1
  prefetch_batches: 4      # reduced from 12: online encoding is slower, less prefetch benefit
  num_prefetch_threads: 2

training:
  num_steps: 200000
  warmup_steps: 1000
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  ema_decay: 0.9999
  ema_update_every: 10
  n_grad_steps_per_fwd: 1
  memory_profile: false
  use_block_injection: false
  correct_forward_q: true
  image_dropout_prob: 0.30
  text_dropout_prob: 0.10
  style_loss_weight: 0.05
  style_loss_every: 1
  cross_ref_prob: 0.5
  patch_shuffle_prob: 0.5

output:
  checkpoint_dir: "train/data/checkpoints/stage1"
  checkpoint_every: 500
  keep_last_n: 5
  log_every: 500

eval:
  enabled: false
  every_steps: 10000
  num_steps: 4
  width: 512
  height: 512
  seed: 42

logging:
  # wandb_project: "iris-ip-adapter"
  # wandb_run_name: "warmup-run1"
