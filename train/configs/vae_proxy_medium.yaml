# train/configs/vae_proxy_medium.yaml
# Proxy VAE distillation — MEDIUM variant (~9.3M params, better fidelity).
#
# Use for final campaign runs or fine-art / OOD sources (e.g. wikiart) where
# latent fidelity matters most. Pair with proxy quality mode "high_fidelity".
# Enables feature distillation for tighter channel-statistics matching.
#
# Train:
#   python train/scripts/train_vae_proxy.py --config train/configs/vae_proxy_medium.yaml

teacher:
  flux_model_dir: "flux-klein-model"

student:
  variant: "medium"                         # [80, 160, 320, 320] → ~9.3M params
  latent_channels:   32
  use_mid_attention: true

data:
  shard_dirs:
    - "/Volumes/16TBCold/shards"
  vae_cache_dir: "/Volumes/16TBCold/precomputed/vae/current"
  image_size:          512
  batch_size:          8
  min_unified_score:   0.40
  max_shards:          null
  seed:                42

losses:
  latent_mse_weight:   1.0
  decoded_mse_weight:  0.15                  # heavier perceptual signal for fidelity
  freq_alpha:          0.50
  dist_weight:         0.01
  feature_weight:      0.05                  # enable intermediate feature distillation

training:
  num_steps:        80000                    # longer schedule for the larger model
  warmup_steps:     800
  learning_rate:    1.5e-4
  weight_decay:     1.0e-2
  grad_clip:        1.0
  log_every:        100
  checkpoint_every: 2000
  keep_last_n:      3
  qat_bits: null

output:
  checkpoint_dir: "/Volumes/2TBSSD/checkpoints/vae_proxy_medium"
