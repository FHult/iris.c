# LoRA training — smoke config (framework Phase 1). Reuses the existing hot VAE+Qwen3 precompute.
# Real-data validation: loss falls on real images + the gen stays coherent (LoRA didn't break the base).
model:
  flux_model_dir: flux-klein-model
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot        # HOT SSD tars (AGENT #6 — never cold)
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]                                   # MUST match the square precompute (warmup invariant #1)
  batch_size: 1
  seed: 42
  records_per_shard_visit: 135                         # interleave all 22 shards
training:
  num_steps: 150
  learning_rate: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
