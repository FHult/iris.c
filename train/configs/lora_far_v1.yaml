# Far-from-prior LoRA — trains on a coherent style cluster curated to sit FAR from the base model's
# own CSD prior (curate_far_subset.py: CSD-encode base generations → prior centroid; pick the densest
# pool cluster maximising distance-from-prior subject to a coherence floor). The selected cluster is a
# fantasy digital-illustration / pop-surrealism portrait style (prior_cos -0.113 vs the photographic
# cluster's +0.037), so the learned style is BOLD at default scale (cf. LORA-TRAIN-2: a near-prior
# cluster gave only a subtle effect).
model:
  flux_model_dir: flux-klein-model
adapter:
  rank: 16
  alpha: 16
data:
  shard_path: /Volumes/2TBSSD/baseline_pool_hot
  vae_cache_dir: /Volumes/2TBSSD/precomputed/vae/v_2232c1
  qwen3_cache_dir: /Volumes/2TBSSD/precomputed/qwen3/v_059443
  bucket: [512, 512]
  batch_size: 1
  seed: 42
  record_allowlist: /Volumes/2TBSSD/sref_eval/lora_far_subset.json
training:
  num_steps: 300
  learning_rate: 1.5e-4
  weight_decay: 0.01
  grad_clip: 1.0
  mlx_memory_pct: 0.6
  ema_decay: 0.9999
  ema_update_every: 10
  checkpoint_every: 150
